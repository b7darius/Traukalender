name: Traukalender-Monitor

# Prueft alle 15 Minuten rund um die Uhr, ob im Traukalender Wiesbaden Termine
# im Zielmonat freigeschaltet wurden. Das Repository ist oeffentlich, damit sind
# die Actions-Minuten unbegrenzt und der Takt kostet nichts.
#
# Achtung: geplante Workflows laufen bei GitHub nur vom Standard-Branch aus.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      monate:
        description: "Zielmonate JJJJ-MM, kommagetrennt (leer = Standard). Zum Testen z.B. 2027-07"
        type: string
        default: ""
      force:
        description: "Auch dann benachrichtigen, wenn schon gemeldet"
        type: boolean
        default: false

concurrency:
  group: traukalender-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # Noetig, um den Workflow nach einer Reservierung selbst abzuschalten.
  actions: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    # Auf Job-Ebene, damit der Buchungsschritt in seiner eigenen if-Bedingung
    # pruefen kann, ob die Personendaten hinterlegt sind. Secrets sind in
    # if-Bedingungen nicht direkt lesbar, ueber env dagegen schon.
    env:
      TK_PERSONENDATEN: ${{ secrets.TK_PERSONENDATEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traukalender pruefen
        id: check
        env:
          TK_MONATE: ${{ inputs.monate || vars.TK_MONATE || '2027-08' }}
          TK_TRAUORTE: ${{ vars.TK_TRAUORTE || 'alle' }}
          TK_NTFY_SERVER: ${{ vars.TK_NTFY_SERVER }}
          TK_NTFY_TOPIC: ${{ secrets.TK_NTFY_TOPIC }}
          TK_NTFY_TOKEN: ${{ secrets.TK_NTFY_TOKEN }}
          TK_SMTP_HOST: ${{ secrets.TK_SMTP_HOST }}
          TK_SMTP_PORT: ${{ secrets.TK_SMTP_PORT }}
          TK_SMTP_USER: ${{ secrets.TK_SMTP_USER }}
          TK_SMTP_PASS: ${{ secrets.TK_SMTP_PASS }}
          TK_MAIL_FROM: ${{ secrets.TK_MAIL_FROM }}
          TK_MAIL_TO: ${{ secrets.TK_MAIL_TO }}
          TK_TELEGRAM_TOKEN: ${{ secrets.TK_TELEGRAM_TOKEN }}
          TK_TELEGRAM_CHAT: ${{ secrets.TK_TELEGRAM_CHAT }}
          TK_WEBHOOK_URL: ${{ secrets.TK_WEBHOOK_URL }}
        run: |
          set +e
          # Ein Testlauf mit eigenem Zielmonat schreibt in eine Wegwerf-Datei,
          # damit der echte Zustand der Ueberwachung unberuehrt bleibt.
          python traukalender_monitor.py \
            --state "${{ inputs.monate && '/tmp/testlauf-state.json' || 'state/state.json' }}" \
            --bericht bericht.md \
            ${{ inputs.force && '--force' || '' }}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

      # Der Bericht wird bei jedem Lauf geschrieben, auch ohne Fund. So zeigt
      # die Zusammenfassung jedes Laufs schwarz auf weiss, was geprueft wurde.
      - name: Zusammenfassung
        if: always()
        run: |
          if [ -f bericht.md ]; then
            cat bericht.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein Bericht erzeugt - siehe Log des Pruefschritts." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Macht sichtbar, warum der Buchungsschritt laeuft oder nicht. Ohne das
      # ist ein uebersprungener Schritt in der Oberflaeche nicht von einem
      # abgeschalteten zu unterscheiden. Enthaelt keine Geheimnisse - nur, ob
      # die Personendaten gesetzt sind, nicht deren Inhalt.
      - name: Buchungs-Gate protokollieren
        run: |
          echo "Ereignis:            ${{ github.event_name }} (Buchung nur bei 'schedule')"
          echo "Personendaten da:    ${{ env.TK_PERSONENDATEN != '' }}"
          echo "TK_BUCHUNG_AKTIV:    '${{ vars.TK_BUCHUNG_AKTIV }}' (leer = an, '0' = Notbremse)"
          echo "Notbremse frei:      ${{ format('{0}', vars.TK_BUCHUNG_AKTIV) != '0' }}"

      # Prueft bei jedem Lauf, ob die hinterlegten Personendaten vollstaendig
      # sind. Ein Tippfehler im Secret faellt so sofort auf und nicht erst in
      # dem Moment, in dem ein Termin frei wird. Ausgegeben wird nur, welche
      # Felder fehlen - nie deren Inhalt, die Protokolle sind oeffentlich.
      - name: Personendaten pruefen
        if: env.TK_PERSONENDATEN != ''
        run: python traukalender_buchung.py --pruefe-daten

      # Zweite, vom Git-Push unabhaengige Bremse. state/gebucht.json wird zwar
      # zurueckgeschrieben, aber dieser Push kann scheitern. Ein Issue mit der
      # Kennung unten bleibt auch dann bestehen und verhindert eine zweite
      # Reservierung.
      - name: Pruefen, ob schon reserviert wurde
        id: schon_gebucht
        if: >-
          github.event_name == 'schedule'
          && env.TK_PERSONENDATEN != ''
          && format('{0}', vars.TK_BUCHUNG_AKTIV) != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const alle = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const gebucht = alle.some(i => (i.body || '').includes('<!-- traukalender:gebucht -->'));
            core.setOutput('gebucht', gebucht ? 'ja' : 'nein');
            if (gebucht) core.info('Es existiert bereits ein Reservierungs-Issue.');

      # Automatische Reservierung.
      #
      # Scharf ist sie genau dann, wenn das Secret TK_PERSONENDATEN hinterlegt
      # ist - dieses Secret anzulegen ist die bewusste Freigabe. Zusaetzlich
      # laeuft der Schritt nur bei geplanten Laeufen, damit ein Testlauf von
      # Hand nichts ausloesen kann.
      #
      # Notbremse ohne Loeschen des Secrets: Variable TK_BUCHUNG_AKTIV auf 0.
      - name: Automatisch reservieren
        id: buchung
        if: >-
          github.event_name == 'schedule'
          && env.TK_PERSONENDATEN != ''
          && format('{0}', vars.TK_BUCHUNG_AKTIV) != '0'
          && steps.schon_gebucht.outputs.gebucht == 'nein'
        env:
          TK_BUCHUNG_AKTIV: "1"
          TK_BUCHUNG_MONATE: ${{ vars.TK_BUCHUNG_MONATE || '2027-08' }}
          TK_BUCHUNG_TRAUORTE: ${{ vars.TK_BUCHUNG_TRAUORTE || '1210,1345' }}
          TK_BUCHUNG_WOCHENTAGE: ${{ vars.TK_BUCHUNG_WOCHENTAGE || 'samstag' }}
          TK_PERSONENDATEN: ${{ secrets.TK_PERSONENDATEN }}
          TK_NTFY_SERVER: ${{ vars.TK_NTFY_SERVER }}
          TK_NTFY_TOPIC: ${{ secrets.TK_NTFY_TOPIC }}
          TK_NTFY_TOKEN: ${{ secrets.TK_NTFY_TOKEN }}
          TK_SMTP_HOST: ${{ secrets.TK_SMTP_HOST }}
          TK_SMTP_PORT: ${{ secrets.TK_SMTP_PORT }}
          TK_SMTP_USER: ${{ secrets.TK_SMTP_USER }}
          TK_SMTP_PASS: ${{ secrets.TK_SMTP_PASS }}
          TK_MAIL_FROM: ${{ secrets.TK_MAIL_FROM }}
          TK_MAIL_TO: ${{ secrets.TK_MAIL_TO }}
          TK_TELEGRAM_TOKEN: ${{ secrets.TK_TELEGRAM_TOKEN }}
          TK_TELEGRAM_CHAT: ${{ secrets.TK_TELEGRAM_CHAT }}
        run: |
          set +e
          python traukalender_buchung.py --wirklich-buchen --state state/gebucht.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 20 ]; then
            echo "### Trautermin reserviert" >> "$GITHUB_STEP_SUMMARY"
            cat state/gebucht.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

      # Der Zustand verhindert Doppelmeldungen. Er aendert sich hoechstens
      # einmal am Tag, dieser Commit haelt zugleich das Repository aktiv -
      # GitHub pausiert geplante Workflows sonst nach 60 Tagen ohne Aktivitaet.
      - name: Zustand zurueckschreiben
        if: always()
        continue-on-error: true
        run: |
          git config user.name "traukalender-monitor"
          git config user.email "actions@github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "Kein neuer Zustand."
            exit 0
          fi
          git commit -m "Zustand aktualisiert [skip ci]"
          for versuch in 1 2 3; do
            if git push; then
              echo "Zustand gespeichert."
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $versuch), hole Aenderungen ..."
            git pull --rebase --autostash || true
            sleep $((versuch * 5))
          done
          echo "::warning::Zustand konnte nicht gepusht werden. Bitte unter" \
               "Settings -> Actions -> General -> Workflow permissions" \
               "'Read and write permissions' aktivieren."
          exit 1

      # Zweiter, von Secrets unabhaengiger Meldeweg. Das Issue wird dem Besitzer
      # zugewiesen und erwaehnt ihn im Text: nur "Watching" auf "All Activity"
      # wuerde eine Mail ausloesen, Zuweisung und @-Erwaehnung dagegen auch bei
      # der Standardeinstellung "Participating and @mentions".
      - name: Issue anlegen, wenn Termine frei sind
        if: steps.check.outputs.exit_code == '10'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- traukalender:${{ steps.check.outputs.marker }} -->`;
            const offen = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (offen.some(issue => (issue.body || '').includes(marker))) {
              core.info('Zu diesem Fund gibt es bereits ein offenes Issue.');
              return;
            }
            const bericht = fs.existsSync('bericht.md')
              ? fs.readFileSync('bericht.md', 'utf8')
              : 'Termine gefunden - Details siehe Workflow-Log.';
            const besitzer = context.repo.owner;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Traukalender: Termine freigeschaltet (${new Date().toISOString().slice(0, 10)})`,
              body: [
                `@${besitzer} - im Traukalender sind Termine frei geworden.`,
                bericht,
                'Reservieren: https://traukalender.wiesbaden.de/de/Start-159.html',
                marker,
              ].join('\n\n'),
              assignees: [besitzer],
            });
            core.info(`Issue #${issue.data.number} angelegt.`);

      # Nach einer Reservierung ist die Aufgabe erledigt. Issue anlegen und den
      # Workflow abschalten - das wirkt sofort und unabhaengig davon, ob der
      # Zustands-Push geklappt hat. Damit kann kein zweiter Termin gebucht
      # werden. Wieder einschalten: Actions -> Traukalender-Monitor -> Enable.
      - name: Reservierung melden und Workflow abschalten
        if: steps.buchung.outputs.exit_code == '20'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const zustand = JSON.parse(fs.readFileSync('state/gebucht.json', 'utf8'));
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Trautermin reserviert: ${zustand.beschreibung}`,
              body: [
                `@${context.repo.owner} - der Trautermin wurde automatisch reserviert.`,
                '```json',
                JSON.stringify(zustand, null, 2),
                '```',
                'Die Bestaetigung des Standesamts kommt per E-Mail.',
                'Aenderungen oder Absage nur direkt beim Standesamt Wiesbaden.',
                'Der Workflow wurde abgeschaltet, es wird nichts weiter gebucht.',
                '<!-- traukalender:gebucht -->',
              ].join('\n\n'),
              assignees: [context.repo.owner],
            });
            core.info(`Issue #${issue.data.number} angelegt.`);
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'traukalender.yml',
            });
            core.info('Workflow abgeschaltet - keine weiteren Laeufe, keine zweite Buchung.');
