name: Traukalender-Monitor

# Prueft alle 15 Minuten rund um die Uhr, ob im Traukalender Wiesbaden Termine
# im Zielmonat freigeschaltet wurden. Das Repository ist oeffentlich, damit sind
# die Actions-Minuten unbegrenzt und der Takt kostet nichts.
#
# Achtung: geplante Workflows laufen bei GitHub nur vom Standard-Branch aus.
on:
  schedule:
    - cron: "*/15 * * * *"
    # Montags ein Lebenszeichen aufs Handy, damit Stille nicht mit einem
    # stillgelegten Monitor verwechselt wird.
    - cron: "5 9 * * 1"
  workflow_dispatch:
    inputs:
      monate:
        description: "Zielmonate JJJJ-MM, kommagetrennt (leer = Standard). Zum Testen z.B. 2027-07"
        type: string
        default: ""
      force:
        description: "Auch dann benachrichtigen, wenn schon gemeldet"
        type: boolean
        default: false
      heartbeat:
        description: "Lebenszeichen senden, auch wenn nichts gefunden wurde"
        type: boolean
        default: false

concurrency:
  group: traukalender-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traukalender pruefen
        id: check
        env:
          TK_MONATE: ${{ inputs.monate || vars.TK_MONATE || '2027-08' }}
          TK_TRAUORTE: ${{ vars.TK_TRAUORTE || 'alle' }}
          TK_NTFY_SERVER: ${{ vars.TK_NTFY_SERVER }}
          TK_NTFY_TOPIC: ${{ secrets.TK_NTFY_TOPIC }}
          TK_NTFY_TOKEN: ${{ secrets.TK_NTFY_TOKEN }}
          TK_SMTP_HOST: ${{ secrets.TK_SMTP_HOST }}
          TK_SMTP_PORT: ${{ secrets.TK_SMTP_PORT }}
          TK_SMTP_USER: ${{ secrets.TK_SMTP_USER }}
          TK_SMTP_PASS: ${{ secrets.TK_SMTP_PASS }}
          TK_MAIL_FROM: ${{ secrets.TK_MAIL_FROM }}
          TK_MAIL_TO: ${{ secrets.TK_MAIL_TO }}
          TK_TELEGRAM_TOKEN: ${{ secrets.TK_TELEGRAM_TOKEN }}
          TK_TELEGRAM_CHAT: ${{ secrets.TK_TELEGRAM_CHAT }}
          TK_WEBHOOK_URL: ${{ secrets.TK_WEBHOOK_URL }}
        run: |
          set +e
          # Ein Testlauf mit eigenem Zielmonat schreibt in eine Wegwerf-Datei,
          # damit der echte Zustand der Ueberwachung unberuehrt bleibt.
          python traukalender_monitor.py \
            --state "${{ inputs.monate && '/tmp/testlauf-state.json' || 'state/state.json' }}" \
            --bericht bericht.md \
            ${{ (inputs.heartbeat || github.event.schedule == '5 9 * * 1') && '--heartbeat' || '' }} \
            ${{ inputs.force && '--force' || '' }}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

      # Der Bericht wird bei jedem Lauf geschrieben, auch ohne Fund. So zeigt
      # die Zusammenfassung jedes Laufs schwarz auf weiss, was geprueft wurde.
      - name: Zusammenfassung
        if: always()
        run: |
          if [ -f bericht.md ]; then
            cat bericht.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein Bericht erzeugt - siehe Log des Pruefschritts." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Der Zustand verhindert Doppelmeldungen. Er aendert sich hoechstens
      # einmal am Tag, dieser Commit haelt zugleich das Repository aktiv -
      # GitHub pausiert geplante Workflows sonst nach 60 Tagen ohne Aktivitaet.
      - name: Zustand zurueckschreiben
        if: always()
        continue-on-error: true
        run: |
          git config user.name "traukalender-monitor"
          git config user.email "actions@github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "Kein neuer Zustand."
            exit 0
          fi
          git commit -m "Zustand aktualisiert [skip ci]"
          for versuch in 1 2 3; do
            if git push; then
              echo "Zustand gespeichert."
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $versuch), hole Aenderungen ..."
            git pull --rebase --autostash || true
            sleep $((versuch * 5))
          done
          echo "::warning::Zustand konnte nicht gepusht werden. Bitte unter" \
               "Settings -> Actions -> General -> Workflow permissions" \
               "'Read and write permissions' aktivieren."
          exit 1

      # Zweiter, von Secrets unabhaengiger Meldeweg. Das Issue wird dem Besitzer
      # zugewiesen und erwaehnt ihn im Text: nur "Watching" auf "All Activity"
      # wuerde eine Mail ausloesen, Zuweisung und @-Erwaehnung dagegen auch bei
      # der Standardeinstellung "Participating and @mentions".
      - name: Issue anlegen, wenn Termine frei sind
        if: steps.check.outputs.exit_code == '10'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- traukalender:${{ steps.check.outputs.marker }} -->`;
            const offen = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (offen.some(issue => (issue.body || '').includes(marker))) {
              core.info('Zu diesem Fund gibt es bereits ein offenes Issue.');
              return;
            }
            const bericht = fs.existsSync('bericht.md')
              ? fs.readFileSync('bericht.md', 'utf8')
              : 'Termine gefunden - Details siehe Workflow-Log.';
            const besitzer = context.repo.owner;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Traukalender: Termine freigeschaltet (${new Date().toISOString().slice(0, 10)})`,
              body: [
                `@${besitzer} - im Traukalender sind Termine frei geworden.`,
                bericht,
                'Reservieren: https://traukalender.wiesbaden.de/de/Start-159.html',
                marker,
              ].join('\n\n'),
              assignees: [besitzer],
            });
            core.info(`Issue #${issue.data.number} angelegt.`);
